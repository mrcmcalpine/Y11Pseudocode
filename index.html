</script><script>const M=JSON.parse(document.getElementById('data').textContent),K='pca.v34';let cur;const gp=()=>JSON.parse(localStorage.getItem(K)||'{}'),sp=x=>localStorage.setItem(K,JSON.stringify(x));function render(){let p=gp();levels.innerHTML=[...new Set(M.map(x=>x.level))].map(l=>{let a=M.filter(x=>x.level===l);return`<section class="level"><div class="eye">LEVEL ${l}</div><h2>${a[0].levelName}</h2><div class="cards">${a.map(x=>`<article class="card ${p[x.id]?.completed?'done':p[x.id]?.needsRevision?'revise':''}" data-id="${x.id}"><div class="eye">${x.id}</div><h3>${x.title}</h3><p>${x.scenario}</p></article>`).join('')}</div></section>`}).join('');const revise=M.filter(x=>p[x.id]?.needsRevision&&!p[x.id]?.completed);if(revise.length)levels.insertAdjacentHTML('afterbegin',`<section class="revisePanel"><div class="eye">TARGETED PRACTICE</div><h2>Revise these missions</h2><p>Answers were revealed for these tasks. Reset and solve them independently to clear them.</p><div class="cards">${revise.map(x=>`<article class="card revise" data-id="${x.id}"><div class="eye">${x.id} · ${x.levelName}</div><h3>${x.title}</h3><p>${x.scenario}</p></article>`).join('')}</div></section>`);document.querySelectorAll('.card').forEach(x=>x.onclick=()=>openM(x.dataset.id))}function openM(id){cur=M.find(x=>x.id===id);draw();dlg.showModal()}function row(b,ind=0,zone='available'){return`<div class="blockRow indent${ind}" data-b="${b.id}" data-indent="${ind}"><div class="code">${b.text}</div><div class="ctrl">${zone==='solution'?'<button class="left">&lt;</button><button class="right">&gt;</button><button class="up">↑</button><button class="down">↓</button><button class="remove">×</button>':'<button class="add">＋</button>'}</div></div>`}function arrangement(){return[...document.querySelectorAll('[data-zone=solution] .blockRow')].map(x=>({id:x.dataset.b,indent:+x.dataset.indent}))}function save(extra={}){let p=gp(),o=p[cur.id]||{};p[cur.id]={...o,arrangement:arrangement(),...extra};sp(p)}function draw(){let p=gp()[cur.id]||{},a=p.arrangement||[],used=new Set(a.map(x=>x.id)),avail=cur.blocks.filter(x=>!used.has(x.id));mission.innerHTML=`<div class="inside"><div class="eye">MISSION ${cur.id}</div><h2>${cur.title}</h2><section class="brief"><div class="eye">MISSION BRIEF</div><h3>What are you trying to achieve?</h3><p>${cur.scenario}</p></section><section class="fixed"><div class="eye">ALREADY COMPLETED</div><h3>Declarations and initialisation</h3><pre>${cur.fixed.join('\n')}</pre></section><div class="workspace"><div class="zone" data-zone="available"><h3>AVAILABLE CODE</h3>${avail.map(x=>row(x)).join('')}</div><div class="zone" data-zone="solution"><h3>YOUR ALGORITHM</h3>${a.map(x=>row(cur.blocks.find(b=>b.id===x.id),x.indent,'solution')).join('')}</div></div><div class="actions"><button class="primary" id="check" ${p.revealLocked?'disabled':''}>Submit code</button><button id="revealAnswer">Reveal answer</button><button id="resetM">Reset mission</button></div><div id="feedback" class="feedback">Use + to add. Use ↑ ↓ to reorder, &lt; &gt; to indent, and × to remove.</div><section id="reflection" class="reflection ${p.completed?'show':''}"><h3>Reflection with Nibble 🦆</h3><p>${cur.reflection}</p><textarea id="refText">${p.refText||''}</textarea><button id="saveRef">Save reflection</button></section></div>`;wire()}function wire(){document.querySelectorAll('.add').forEach(b=>b.onclick=()=>{let r=b.closest('.blockRow');document.querySelector('[data-zone=solution]').insertAdjacentHTML('beforeend',row(cur.blocks.find(x=>x.id===r.dataset.b),0,'solution'));save();draw()});document.querySelectorAll('[data-zone=solution] .ctrl button').forEach(b=>b.onclick=()=>{let r=b.closest('.blockRow'),z=r.parentElement,i=+r.dataset.indent;if(b.classList.contains('left'))r.dataset.indent=Math.max(0,i-1);if(b.classList.contains('right'))r.dataset.indent=Math.min(3,i+1);if(b.classList.contains('up')&&r.previousElementSibling?.classList.contains('blockRow'))z.insertBefore(r,r.previousElementSibling);if(b.classList.contains('down')&&r.nextElementSibling)z.insertBefore(r.nextElementSibling,r);if(b.classList.contains('remove'))r.remove();save();draw()});check.onclick=submit;revealAnswer.onclick=()=>{if(!confirm('Reveal the complete answer? This will show the correct order and indentation, but will not mark the mission as completed.'))return;const arrangement=cur.solution.map(id=>{const block=cur.blocks.find(b=>b.id===id);return{id,indent:block.expectedIndent}});let p=gp(),o=p[cur.id]||{};p[cur.id]={...o,arrangement,revealed:true,revealLocked:true,needsRevision:true,completed:false};sp(p);draw();feedback.textContent='Answer revealed. Submit is locked. Use Reset mission before trying again.';};resetM.onclick=()=>{let p=gp();delete p[cur.id];sp(p);draw();render()};if(window.saveRef)saveRef.onclick=()=>{let t=refText.value.trim();if(t.length<20)return alert('Please explain in a little more detail.');save({reflection:true,refText:t});render();dlg.close();window.scrollTo({top:document.querySelector(`[data-id=\"${cur.id}\"]`).offsetTop-120,behavior:'smooth'})}}function submit(){if(gp()[cur.id]?.revealLocked){feedback.textContent='Submit is locked after revealing the answer. Reset the mission first.';return;}let a=arrangement(),req=cur.solution,missing=req.some(x=>!a.some(y=>y.id===x)),extra=a.some(x=>!req.includes(x.id)),bad=req.some((x,i)=>i&&a.findIndex(y=>y.id===req[i-1])>a.findIndex(y=>y.id===x)),indentErrors=a.filter(x=>req.includes(x.id)&&x.indent!==cur.blocks.find(b=>b.id===x.id).expectedIndent);let ok=!missing&&!extra&&!bad&&!indentErrors.length,p=gp(),o=p[cur.id]||{};p[cur.id]={...o,arrangement:a,completed:ok,needsRevision:ok?false:o.needsRevision};sp(p);feedback.textContent=ok?'Code and indentation accepted. Reflection unlocked.':missing?'Required code is missing.':extra?'An unused distractor is in your algorithm.':bad?'The statement order is not yet correct.':`Indentation is incorrect on ${indentErrors.length} line${indentErrors.length===1?'':'s'}. Check the nesting of loops and selection.`;if(ok)reflection.classList.add('show');render()}function renderReflections(){const p=gp(),saved=M.filter(m=>p[m.id]?.reflection&&p[m.id]?.refText);reflectionList.innerHTML=saved.length?saved.map(m=>`<article class=\"reflectionItem\"><div class=\"eye\">${m.id} · ${m.levelName}</div><h3>${m.title}</h3><p><strong>Prompt:</strong> ${m.reflection}</p><blockquote>${p[m.id].refText}</blockquote></article>`).join(''):'<div class=\"emptyState\">No reflections have been submitted yet.</div>';}viewReflections.onclick=()=>{renderReflections();reflectionDlg.showModal()};closeReflections.onclick=()=>reflectionDlg.close();closeBtn.onclick=()=>dlg.close();resetAll.onclick=()=>{if(confirm('Reset all progress?')){localStorage.removeItem(K);render()}};render();</script></body></html>
