<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pseudo-Cod Academy</title><style>*{box-sizing:border-box}:root{--bg:#07111f;--p:#10243c;--p2:#173758;--t:#eff9ff;--m:#abc0d6;--g:#3ce0b5;--v:#9d84ff;--y:#ffd166;--line:#315474}body{margin:0;background:radial-gradient(circle at 10% 0,#1d4678,transparent 32%),radial-gradient(circle at 90% 0,#432978,transparent 28%),var(--bg);color:var(--t);font-family:Inter,system-ui}header{padding:24px 5vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}h1{margin:0}.eye{color:var(--g);font-size:.74rem;font-weight:900;letter-spacing:.14em}button{background:var(--p2);color:var(--t);border:1px solid #426789;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}main{width:min(1320px,96vw);margin:28px auto}.hero{padding:30px;background:linear-gradient(135deg,#153451,#222149);border:1px solid #42617e;border-radius:23px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.level{margin-top:32px}.card{background:linear-gradient(145deg,#101d2e,#0a1421);border:1px solid #263d55;border-radius:17px;padding:18px;cursor:pointer;opacity:.7;filter:saturate(.62);transition:.2s}.card:hover{opacity:1;filter:none;transform:translateY(-3px)}.card.revise{background:linear-gradient(145deg,#b85d16,#71350d);border:2px solid #ffb35c;box-shadow:0 12px 32px #2b1208aa;opacity:1;filter:none}.card.revise:before{content:'↻ REVISE';color:#fff1dc;font-size:.8rem;font-weight:950}.revisePanel{margin:28px 0;padding:24px;border:1px solid #c56c2c;border-radius:20px;background:linear-gradient(135deg,#38200f,#27170c)}button:disabled{opacity:.4;cursor:not-allowed}.card.done{background:linear-gradient(145deg,#18a875,#087052);border:2px solid #7affd4;box-shadow:0 0 0 2px #27e6af33,0 14px 38px #031d1466;opacity:1;filter:none;color:#ffffff}.card.done h3{font-size:1.35rem;margin:.55rem 0}.card.done p{color:#eafff8;font-weight:650}.card.done .eye{color:#d4fff1}.card.done:before{content:'✓ COMPLETED';display:inline-block;background:#e5fff6;color:#07523e;padding:6px 10px;border-radius:99px;font-size:.82rem;font-weight:950;letter-spacing:.08em}.card p{color:var(--m)}dialog{width:min(1320px,98vw);max-height:96vh;background:var(--bg);color:var(--t);border:1px solid #456887;border-radius:20px;padding:0}.inside{padding:30px}.close{float:right;margin:10px}.brief,.fixed{background:linear-gradient(135deg,#153552,#20264d);border:1px solid #42617e;border-radius:16px;padding:18px;margin:14px 0}.fixed pre{font:700 1.08rem/1.65 'Courier New',monospace;margin:6px 0}.workspace{display:grid;grid-template-columns:minmax(360px,.85fr) minmax(560px,1.5fr);gap:16px}.zone{min-height:420px;background:#0d1d30;border:1px solid var(--line);border-radius:14px;padding:16px}.zone h3{font-size:.88rem;color:var(--m)}.blockRow{display:flex;align-items:stretch;gap:8px;margin:10px 0}.code{flex:1;background:#193a5e;border:1px solid #467197;border-radius:9px;padding:14px;font:700 1.08rem/1.5 'Courier New',monospace;white-space:pre-wrap;min-height:54px}.ctrl{display:flex;gap:4px;align-items:center}.ctrl button{padding:8px 10px;min-width:38px;font-size:1rem}.indent1 .code{padding-left:38px}.indent2 .code{padding-left:64px}.indent3 .code{padding-left:90px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.primary{background:var(--g);color:#04251e}.feedback{padding:14px;background:#172b42;border-left:4px solid var(--y);border-radius:10px}.reflection{display:none;margin-top:18px;padding:18px;background:#10322f;border:1px solid var(--g);border-radius:14px}.reflection.show{display:block}.reflectionList{display:grid;gap:12px}.reflectionItem{background:#10263c;border:1px solid #345a77;border-radius:14px;padding:16px}.reflectionItem h3{margin:.2rem 0}.reflectionItem blockquote{margin:10px 0 0;padding:12px 15px;background:#071522;border-left:4px solid var(--g);white-space:pre-wrap}.emptyState{padding:28px;text-align:center;color:var(--m)}textarea{width:100%;min-height:90px;background:#071522;color:var(--t);border:1px solid var(--line);padding:10px}@media(max-width:900px){.workspace{grid-template-columns:1fr}.zone{min-height:220px}}</style></head><body><header><div><div class="eye">CAMBRIDGE IGCSE 0478</div><h1>🐟 Pseudo-Cod Academy 🦆</h1></div><div><button id="viewReflections">View reflections</button> <button id="resetAll">Reset all</button></div></header><main><section class="hero"><div class="eye">MISSION CONTROL</div><h2>Build, indent and explain.</h2><p>Declarations and initialisation are provided. Construct and correctly indent the executable algorithm.</p></section><div id="levels"></div></main><dialog id="dlg"><button class="close" id="closeBtn">×</button><div id="mission"></div></dialog><dialog id="reflectionDlg"><button class="close" id="closeReflections">×</button><div class="inside"><div class="eye">LEARNING JOURNAL</div><h2>Reflection submissions</h2><p>Review all saved student reflections from this browser.</p><div id="reflectionList" class="reflectionList"></div></div></dialog><script id="data" type="application/json">

</script><script>const M=JSON.parse(document.getElementById('data').textContent),K='pca.v34';let cur;const gp=()=>JSON.parse(localStorage.getItem(K)||'{}'),sp=x=>localStorage.setItem(K,JSON.stringify(x));function render(){let p=gp();levels.innerHTML=[...new Set(M.map(x=>x.level))].map(l=>{let a=M.filter(x=>x.level===l);return`<section class="level"><div class="eye">LEVEL ${l}</div><h2>${a[0].levelName}</h2><div class="cards">${a.map(x=>`<article class="card ${p[x.id]?.completed?'done':p[x.id]?.needsRevision?'revise':''}" data-id="${x.id}"><div class="eye">${x.id}</div><h3>${x.title}</h3><p>${x.scenario}</p></article>`).join('')}</div></section>`}).join('');const revise=M.filter(x=>p[x.id]?.needsRevision&&!p[x.id]?.completed);if(revise.length)levels.insertAdjacentHTML('afterbegin',`<section class="revisePanel"><div class="eye">TARGETED PRACTICE</div><h2>Revise these missions</h2><p>Answers were revealed for these tasks. Reset and solve them independently to clear them.</p><div class="cards">${revise.map(x=>`<article class="card revise" data-id="${x.id}"><div class="eye">${x.id} · ${x.levelName}</div><h3>${x.title}</h3><p>${x.scenario}</p></article>`).join('')}</div></section>`);document.querySelectorAll('.card').forEach(x=>x.onclick=()=>openM(x.dataset.id))}
  function shuffleBlocks(blocks){
    const shuffled=[...blocks];

    for(let i=shuffled.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
    }

    return shuffled;
}

function openM(id){
    const original=M.find(x=>x.id===id);

    cur={
        ...original,
        blocks:shuffleBlocks(original.blocks)
    };

    draw();
    dlg.showModal()
}
  
  
  function row(b,ind=0,zone='available'){return`<div class="blockRow indent${ind}" data-b="${b.id}" data-indent="${ind}"><div class="code">${b.text}</div><div class="ctrl">${zone==='solution'?'<button class="left">&lt;</button><button class="right">&gt;</button><button class="up">↑</button><button class="down">↓</button><button class="remove">×</button>':'<button class="add">＋</button>'}</div></div>`}function arrangement(){return[...document.querySelectorAll('[data-zone=solution] .blockRow')].map(x=>({id:x.dataset.b,indent:+x.dataset.indent}))}function save(extra={}){let p=gp(),o=p[cur.id]||{};p[cur.id]={...o,arrangement:arrangement(),...extra};sp(p)}function draw(){let p=gp()[cur.id]||{},a=p.arrangement||[],used=new Set(a.map(x=>x.id)),avail=cur.blocks.filter(x=>!used.has(x.id));mission.innerHTML=`<div class="inside"><div class="eye">MISSION ${cur.id}</div><h2>${cur.title}</h2><section class="brief"><div class="eye">MISSION BRIEF</div><h3>What are you trying to achieve?</h3><p>${cur.scenario}</p></section><section class="fixed"><div class="eye">ALREADY COMPLETED</div><h3>Declarations and initialisation</h3><pre>${cur.fixed.join('\n')}</pre></section><div class="workspace"><div class="zone" data-zone="available"><h3>AVAILABLE CODE</h3>${avail.map(x=>row(x)).join('')}</div><div class="zone" data-zone="solution"><h3>YOUR ALGORITHM</h3>${a.map(x=>row(cur.blocks.find(b=>b.id===x.id),x.indent,'solution')).join('')}</div></div><div class="actions"><button class="primary" id="check" ${p.revealLocked?'disabled':''}>Submit code</button><button id="revealAnswer">Reveal answer</button><button id="resetM">Reset mission</button></div><div id="feedback" class="feedback">Use + to add. Use ↑ ↓ to reorder, &lt; &gt; to indent, and × to remove.</div><section id="reflection" class="reflection ${p.completed?'show':''}"><h3>Reflection with Nibble 🦆</h3><p>${cur.reflection}</p><textarea id="refText">${p.refText||''}</textarea><button id="saveRef">Save reflection</button></section></div>`;wire()}function wire(){document.querySelectorAll('.add').forEach(b=>b.onclick=()=>{let r=b.closest('.blockRow');document.querySelector('[data-zone=solution]').insertAdjacentHTML('beforeend',row(cur.blocks.find(x=>x.id===r.dataset.b),0,'solution'));save();draw()});document.querySelectorAll('[data-zone=solution] .ctrl button').forEach(b=>b.onclick=()=>{let r=b.closest('.blockRow'),z=r.parentElement,i=+r.dataset.indent;if(b.classList.contains('left'))r.dataset.indent=Math.max(0,i-1);if(b.classList.contains('right'))r.dataset.indent=Math.min(3,i+1);if(b.classList.contains('up')&&r.previousElementSibling?.classList.contains('blockRow'))z.insertBefore(r,r.previousElementSibling);if(b.classList.contains('down')&&r.nextElementSibling)z.insertBefore(r.nextElementSibling,r);if(b.classList.contains('remove'))r.remove();save();draw()});check.onclick=submit;revealAnswer.onclick=()=>{if(!confirm('Reveal the complete answer? This will show the correct order and indentation, but will not mark the mission as completed.'))return;const arrangement=cur.solution.map(id=>{const block=cur.blocks.find(b=>b.id===id);return{id,indent:block.expectedIndent}});let p=gp(),o=p[cur.id]||{};p[cur.id]={...o,arrangement,revealed:true,revealLocked:true,needsRevision:true,completed:false};sp(p);draw();feedback.textContent='Answer revealed. Submit is locked. Use Reset mission before trying again.';};resetM.onclick=()=>{let p=gp();delete p[cur.id];sp(p);draw();render()};if(window.saveRef)saveRef.onclick=()=>{let t=refText.value.trim();if(t.length<20)return alert('Please explain in a little more detail.');save({reflection:true,refText:t});render();dlg.close();window.scrollTo({top:document.querySelector(`[data-id=\"${cur.id}\"]`).offsetTop-120,behavior:'smooth'})}}function submit(){if(gp()[cur.id]?.revealLocked){feedback.textContent='Submit is locked after revealing the answer. Reset the mission first.';return;}let a=arrangement(),req=cur.solution,missing=req.some(x=>!a.some(y=>y.id===x)),extra=a.some(x=>!req.includes(x.id)),bad=req.some((x,i)=>i&&a.findIndex(y=>y.id===req[i-1])>a.findIndex(y=>y.id===x)),indentErrors=a.filter(x=>req.includes(x.id)&&x.indent!==cur.blocks.find(b=>b.id===x.id).expectedIndent);let ok=!missing&&!extra&&!bad&&!indentErrors.length,p=gp(),o=p[cur.id]||{};p[cur.id]={...o,arrangement:a,completed:ok,needsRevision:ok?false:o.needsRevision};sp(p);feedback.textContent=ok?'Code and indentation accepted. Reflection unlocked.':missing?'Required code is missing.':extra?'An unused distractor is in your algorithm.':bad?'The statement order is not yet correct.':`Indentation is incorrect on ${indentErrors.length} line${indentErrors.length===1?'':'s'}. Check the nesting of loops and selection.`;if(ok)reflection.classList.add('show');render()}function renderReflections(){const p=gp(),saved=M.filter(m=>p[m.id]?.reflection&&p[m.id]?.refText);reflectionList.innerHTML=saved.length?saved.map(m=>`<article class=\"reflectionItem\"><div class=\"eye\">${m.id} · ${m.levelName}</div><h3>${m.title}</h3><p><strong>Prompt:</strong> ${m.reflection}</p><blockquote>${p[m.id].refText}</blockquote></article>`).join(''):'<div class=\"emptyState\">No reflections have been submitted yet.</div>';}viewReflections.onclick=()=>{renderReflections();reflectionDlg.showModal()};closeReflections.onclick=()=>reflectionDlg.close();closeBtn.onclick=()=>dlg.close();resetAll.onclick=()=>{if(confirm('Reset all progress?')){localStorage.removeItem(K);render()}};render();</script></body></html>
